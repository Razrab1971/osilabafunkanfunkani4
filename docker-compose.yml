services:

  telegram_bot:
    build: ./
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 1024M
    restart: 'unless-stopped'
    depends_on:
      db:
        condition: service_healthy
    container_name: telegram-bot
    environment:
      - DB_USER=bot_tg
      - DB_NAME=botdb
      - DB_HOST=postgres18-db
      - DB_PORT=5432
      - DB_PASSWORD_FILE=/run/secrets/db-password2
      - TOKEN_BOT_FILE=/run/secrets/token-bot
      # Пути к секретам
    secrets:
      - db-password2
      - token-bot
      # Настройка логов
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  db:
    image: postgres:18-alpine
    #Настройки потребления Железа
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 1024M
    restart: 'unless-stopped'
    secrets:
      - db-password
      - db-password2
    user: postgres
    #Сам контейнер
    container_name: postgres18-db
    environment:    
        - POSTGRES_DB=botdb 
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
        - PGDATA=/var/lib/postgresql/data
    expose:
        - 5432 # Пока только слушает этот порт и не отвечает
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10m
      timeout: 5s
      retries: 5
      start_period: 40s
    # Настройка окружения и запуск
    volumes:
      - ./db/start-db.sh:/start-db.sh
      - ./db/start.sql:/start.sql
      - db-data:/var/lib/postgresql
    entrypoint: "/bin/bash /start-db.sh"
    # Настройка логов
    logging:
       driver: "json-file"
       options:
        max-size: "20m"
        max-file: "1"


             
             
             
             
             

secrets:
  db-password:
    file: .secrets/db-password
  token-bot:
    file: .secrets/TOKEN_bot
  db-password2:
    file: .secrets/db-password2

volumes:
  db-data:


