services:

  telegram_bot:
    build: ./
    container_name: telegramr-bot
    depends_on:
       - db


  db:
    image: postgres:18-alpine
    #Настройки потребления Железа
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    restart: 'always'
    secrets:
      - db-password
    user: postgres
    #Сам контейнер
    container_name: postgres18-db
    environment:    
        - POSTGRES_DB=botdb 
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
        - 5432 # Пока только слушает этот порт и не отвечает
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Настройка окружения и запуск
    volumes:
      - ./db/start-db.sh:/start-db.sh
      - ./db/start.sql:/start.sql
      - db-data:/var/lib/postgresql/data
    entrypoint: "/bin/bash /start-db.sh"
             
             
             
             
             

secrets:
  db-password:
    file: .secrets/db-password

volumes:
  db-data:


